<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Kế Hoạch Field Ngày</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="page">

    <section class="card">

      <div class="page-header">
        <div>
          <h1>Kế Hoạch Field Ngày</h1>
          <p>Cán bộ nhập thông tin khách hàng</p>
        </div>
      </div>

      <form id="fieldForm">

        <div class="form-group">
          <label for="cif">
            CIF
          </label>

          <input
            type="text"
            id="cif"
            placeholder="Nhập CIF"
            autocomplete="off"
            required
          />
        </div>


        <div class="form-group">
          <label for="tenKh">
            Tên KH
          </label>

          <input
            type="text"
            id="tenKh"
            placeholder="Nhập tên khách hàng"
            autocomplete="off"
            required
          />
        </div>


        <div class="form-group">
          <label for="CbXln">
            CBXLN
          </label>

          <input
            type="text"
            id="userCbXln"
            placeholder="Nhập User CBXLN"
            autocomplete="off"
            required
          />
        </div>


        <div class="form-group">
          <label for="ngayField">
            Ngày field
          </label>

          <input
            type="date"
            id="ngayField"
            required
          />
        </div>


        <button
          type="submit"
          id="saveBtn"
          class="btn btn-primary"
        >
          LƯU DỮ LIỆU
        </button>
 <div class="security-note">
  <span class="lock-icon">🔒</span>
  <span>Dữ liệu được lưu bảo mật tập trung trên hệ thống quản lý</span>
</div>
      </form>

      <div
        id="message"
        class="message hidden"
      ></div>

    </section>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="app.js"></script>

</body>
</html>
